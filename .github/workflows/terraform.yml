name: Terraform

# Ordem entre os repositórios:
#   apply:   fiap-k8s → fiap-database → fiap-lambda
#   destroy: fiap-lambda → fiap-database → fiap-k8s
# Com o secret DISPATCH_TOKEN, um workflow_dispatch com "chain" (ou um repository_dispatch
# vindo do repositório anterior) dispara o próximo da fila ao terminar.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      action:
        description: "apply ou destroy"
        type: choice
        options: [apply, destroy]
        default: apply
      chain:
        description: "Disparar o próximo repositório ao terminar"
        type: boolean
        default: true
  repository_dispatch:
    types: [apply, destroy]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/prod
  NEXT_ON_APPLY: fiap-database
  NEXT_ON_DESTROY: ""

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=$TF_DIR fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=$TF_DIR init -backend=false -input=false
          terraform -chdir=$TF_DIR validate

  deploy:
    name: Deploy (${{ github.event.inputs.action || github.event.action || 'apply' }})
    needs: validate
    # develop (homologação) para no validate: o Learner Lab comporta um ambiente só.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ github.event.inputs.action || github.event.action || 'apply' }}
      CHAIN: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.chain == 'true' }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_postgresPassword: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_jwtSecret: ${{ secrets.JWT_SECRET }}
      TF_VAR_accessKeyId: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_secretAccessKey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_sessionToken: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O nome do bucket depende da conta (que muda a cada Learner Lab), por isso entra
      # pelo -backend-config e não no backend.tf. Em conta nova o bucket ainda não existe.
      - name: terraform init
        run: |
          BUCKET="fiap-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=fiap/k8s.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"

      - name: terraform apply
        if: env.ACTION == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Reaproveita o appPublicUrl do run anterior para não zerar os links do e-mail
          # (e reiniciar os pods) a cada apply.
          PREV_URL=$(terraform output -raw api_public_url 2>/dev/null || true)
          terraform apply -auto-approve -input=false -var "appPublicUrl=$PREV_URL"

          # O ELB da API leva alguns minutos para ganhar hostname.
          URL=""
          for i in $(seq 1 30); do
            URL=$(terraform output -raw api_public_url 2>/dev/null || true)
            [ -n "$URL" ] && break
            echo "Aguardando hostname do Load Balancer da API ($i/30)..."
            sleep 20
            terraform apply -refresh-only -auto-approve -input=false > /dev/null
          done
          if [ -z "$URL" ]; then
            echo "::error::O Load Balancer da API não ganhou hostname em 10 minutos."
            exit 1
          fi

          if [ "$URL" != "$PREV_URL" ]; then
            terraform apply -auto-approve -input=false -var "appPublicUrl=$URL"
          fi
          echo "### API: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: terraform destroy
        if: env.ACTION == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: |
          PREV_URL=$(terraform output -raw api_public_url 2>/dev/null || true)
          terraform destroy -auto-approve -input=false -var "appPublicUrl=$PREV_URL"

      - name: Disparar o próximo repositório
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        if: env.CHAIN == 'true'
        run: |
          if [ "$ACTION" = "destroy" ]; then NEXT="$NEXT_ON_DESTROY"; else NEXT="$NEXT_ON_APPLY"; fi
          if [ -z "$NEXT" ]; then
            echo "Último repositório da fila para '$ACTION'."
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::Sem o secret DISPATCH_TOKEN; rode o $NEXT manualmente."
          else
            gh api "repos/${{ github.repository_owner }}/$NEXT/dispatches" -f event_type="$ACTION"
            echo "Disparado: $NEXT ($ACTION)"
          fi
