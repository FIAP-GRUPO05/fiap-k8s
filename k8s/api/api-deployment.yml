apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-pod         
  template:
    metadata:
      labels:
        app: api-pod       
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-container
        image: timbeck97/tc-fiap:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: java-tmp
          mountPath: /tmp
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: api-secret
        resources:
          # Base do calculo do HPA: "70% de CPU" significa 70% destas requests.
          requests:
            cpu: "250m"      # 0,25 vCPU
            memory: "348Mi"
      volumes:
      - name: java-tmp
        emptyDir: {}
