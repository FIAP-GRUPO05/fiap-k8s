apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment        
  minReplicas: 1                
  maxReplicas: 5                
  # CPU e memoria dependem do metrics-server; sem ele o HPA fica em <unknown>/70%
  # e nao escala. Ele e provisionado como addon do minikube em infra/dev.
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30 
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
 